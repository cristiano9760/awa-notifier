name: Alienware Arena Giveaway Notifier

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-giveaways:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run Alienware notifier
        run: python alienware.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save seen giveaways
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add alienware_seen.json
          git commit -m "Update Alienware seen giveaways" || echo "No changes"
          git push